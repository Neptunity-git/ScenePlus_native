<!DOCTYPE html>
<html>
<head>
<script src="scene://_core/ScenePlus-SDK.js"></script>
<style>
  body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
  #screen-display {
    width: 100vw;
    height: 100vh;
    object-position: center;
    object-fit: cover;
    filter: invert(1) hue-rotate(180deg) brightness(1.2);
  }
</style>
</head>
<body>
<img id="screen-display" src="" />
<script>
  let active = false;
  
  function captureLoop() {
    if (!active) return;
    ScenePlus.captureScreen('low', (dataUrl, err) => {
        if (!err && dataUrl) {
            document.getElementById('screen-display').src = dataUrl;
        }
        // Throttle slightly to keep UI smooth (15 fps max)
        setTimeout(captureLoop, 66);
    });
  }

  ScenePlus.onInit((meta, env) => {
    active = true;
    captureLoop();
  });

  ScenePlus.onPanic(() => {
    active = false;
  });
</script>
</body>
</html>
