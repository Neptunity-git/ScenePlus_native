<!DOCTYPE html>
<html>
<head>
<script src="scene://_core/ScenePlus-SDK.js"></script>
<style>
  body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
  .particle {
    position: absolute;
    width: 20px;
    height: 20px;
    background: radial-gradient(circle, #fff, #39ff14, transparent);
    border-radius: 50%;
    pointer-events: none;
    animation: explode 0.8s ease-out forwards;
  }
  @keyframes explode {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(5); opacity: 0; }
  }
</style>
</head>
<body>
<script>
  let autoTimer;
  ScenePlus.onInit((meta, env) => {
    // Fire particles based on current mouse pos at init
    const pos = ScenePlus.getMousePosition();
    for (let i = 0; i < 15; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.random() * 50;
        p.style.left = (pos.x + Math.cos(angle) * radius - 10) + 'px';
        p.style.top = (pos.y + Math.sin(angle) * radius - 10) + 'px';
        document.body.appendChild(p);
    }
    
    // Auto finish before duration to test self-termination
    autoTimer = setTimeout(() => {
        ScenePlus.finish();
    }, 1500);
  });
</script>
</body>
</html>
